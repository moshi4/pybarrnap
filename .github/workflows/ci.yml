name: CI
on:
  push:
    branches: [main, develop]
    paths: ["src/**", "tests/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["src/**", "tests/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

jobs:
  CI:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python ${{ matrix.python-version }} & dependencies
        run: uv sync --all-extras --all-groups --upgrade --python ${{ matrix.python-version }}

      - name: Install optional dependent tool (infernal) on Ubuntu
        run: |
          sudo apt update -y
          sudo apt install -y infernal
        if: ${{ matrix.os=='ubuntu-latest'}}

      - name: Install optional dependent tool (infernal) on MacOS
        run: |
          brew tap brewsci/bio
          brew install infernal
        if: ${{ matrix.os=='macos-latest'}}

      - name: Run ruff lint check
        run: uv run ruff check src tests

      - name: Run ruff format check
        run: uv run ruff format src tests

      - name: Run ty type check
        run: uv run ty check src tests

      - name: Run pytest
        run: uv run pytest
